<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ИНН / СНИЛС генератор</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Генератор документов</h1>
        <p class="app__subtitle">Тестовые реквизиты: ИНН, СНИЛС и не только</p>
      </header>

      <!-- Управление сайтом: где расширение само подставляет значения -->
      <section class="site" id="siteCard" hidden>
        <div class="site__info">
          <span class="site__host" id="siteHost">—</span>
          <span class="site__status" id="siteStatus">Не активен на этом сайте</span>
        </div>
        <button class="site__btn" id="siteBtn" type="button">Добавить этот сайт</button>
      </section>

      <!-- Сегментированный выбор типа документа -->
      <fieldset class="segmented" role="radiogroup" aria-label="Тип документа">
        <legend class="visually-hidden">Тип документа</legend>
        <label class="segmented__item">
          <input type="radio" name="type" value="fl" checked />
          <span class="segmented__label">ФЛ</span>
          <span class="segmented__hint">ИНН, 12 цифр</span>
        </label>
        <label class="segmented__item">
          <input type="radio" name="type" value="ip" />
          <span class="segmented__label">ИП</span>
          <span class="segmented__hint">ИНН, 12 цифр</span>
        </label>
        <label class="segmented__item">
          <input type="radio" name="type" value="ul" />
          <span class="segmented__label">ЮЛ</span>
          <span class="segmented__hint">ИНН, 10 цифр</span>
        </label>
        <label class="segmented__item">
          <input type="radio" name="type" value="snils" />
          <span class="segmented__label">СНИЛС</span>
          <span class="segmented__hint">11 цифр</span>
        </label>
      </fieldset>

      <!-- Карточка результата -->
      <section class="result" id="resultCard" role="button" tabindex="0"
               aria-label="Сгенерированное значение, нажмите чтобы скопировать">
        <span class="result__value" id="resultValue">—</span>
        <span class="result__type" id="resultType">физическое лицо</span>
      </section>

      <!-- Действия -->
      <div class="actions">
        <button class="btn btn--primary" id="copyBtn" type="button">
          <svg class="btn__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="btn__text">Копировать</span>
        </button>
        <button class="btn btn--ghost" id="refreshBtn" type="button" title="Сгенерировать новое" aria-label="Сгенерировать новое">
          <svg class="btn__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M21 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <footer class="app__footer">
        <span>Все значения вымышленные, для тестов</span>
      </footer>
    </main>

    <script src="../lib/data.js"></script>
    <script src="../lib/generators.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
